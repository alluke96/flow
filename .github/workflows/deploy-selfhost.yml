name: Deploy to self-hosted Windows

# Runs on the self-hosted runner registered on your Windows PC (see
# docs/selfhost-windows.md for the one-time setup). Nothing here touches
# Vercel — this is a separate, independent deploy target.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      # The Flow service serves directly out of this same checkout folder —
      # while it's running, Windows holds its files locked, and checkout's
      # own cleanup step (deleting the folder's contents before re-cloning)
      # hangs forever trying to delete files that are in use. Stopping the
      # service first releases those locks. Restart-Service at the end
      # works fine even starting from "stopped" (no error either way).
      - name: Stop service (release file locks before checkout)
        shell: powershell
        run: Stop-Service -Name "Flow" -ErrorAction SilentlyContinue

      - uses: actions/checkout@v4

      # .env.local has real secrets (Drive service account key) — it must
      # never live in git. It's kept once, outside the checkout, at
      # C:\flow-secrets\.env.local, and copied into the fresh checkout on
      # every deploy instead.
      - name: Restore local secrets
        shell: powershell
        run: Copy-Item "C:\flow-secrets\.env.local" -Destination ".env.local" -Force

      # cmd, not the runner's default PowerShell shell: npm on Windows is a
      # .ps1 wrapper, subject to PowerShell's execution policy — cmd isn't,
      # so this keeps deploys working even if a future account running the
      # runner service never had RemoteSigned set (see setup doc).
      - name: Install dependencies
        shell: cmd
        run: npm ci

      - name: Build
        shell: cmd
        run: npm run build

      # NSSM-managed Windows service named "Flow" (see setup doc). Restarting
      # it re-launches `next start` against the build that was just produced
      # in this same checkout, which is why the service's working directory
      # must point at wherever the runner checks this repo out to.
      - name: Restart service
        shell: powershell
        run: Restart-Service -Name "Flow"
